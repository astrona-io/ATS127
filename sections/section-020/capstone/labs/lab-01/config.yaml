# Harden An Open EventListener (capstone)
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-127-capstone-020"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton"
      description: "Installs the tkn CLI 0.46.2, Tekton Pipelines v1.17.1 and Tekton Triggers v0.37.2 with the core interceptors, and starts the webhook client"
      type: "file"
      source: "bootstrap/01-install-tekton.sh"
    - name: "ats-127-capstone-020-setup"
      description: "Applies the Pipeline, RBAC, binding, template and the EventListener starfleet-ci without interceptors"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespace starfleet"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-tekton"
      description: "Waits until every Tekton Deployment and the webhook client are ready"
      type: "file"
      source: "testing/wait-for-tekton.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-eventlistener-ready"
      description: "Confirms the EventListener starfleet-ci uses the ServiceAccount starfleet-triggers and is Ready"
      type: "file"
      source: "validation/validate-eventlistener-ready.sh"
    - name: "validate-interceptor-chain"
      description: "Confirms the Secret holds the webhook secret and the github interceptor runs before the cel interceptor"
      type: "file"
      source: "validation/validate-interceptor-chain.sh"
    - name: "validate-signed-push"
      description: "Sends a signed push to main and confirms a ci-build PipelineRun with branch main succeeds"
      type: "file"
      source: "validation/validate-signed-push.sh"
    - name: "validate-signature-required"
      description: "Sends an unsigned push and a push signed with a wrong secret and confirms neither creates a PipelineRun"
      type: "file"
      source: "validation/validate-signature-required.sh"
    - name: "validate-filters"
      description: "Sends a signed push to another branch and a signed pull_request event and confirms neither creates a PipelineRun"
      type: "file"
      source: "validation/validate-filters.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
      - nicolaka/netshoot:v0.13
