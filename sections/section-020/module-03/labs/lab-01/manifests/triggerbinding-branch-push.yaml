# The faulty binding of the lab: the service returns the extension
# short_branch, but this binding reads branch.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: branch-push
  namespace: starfleet
spec:
  params:
    - name: repo-url
      value: $(body.repository.clone_url)
    - name: revision
      value: $(body.head_commit.id)
    - name: branch
      value: $(extensions.branch)
