# The Trigger for push events, as its own object. The label team: starfleet
# lets the EventListener starfleet-ci select it. The github interceptor checks
# the signature and the event type; the cel interceptor lets through only
# pushes to main and stores the short branch name.
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: github-push
  namespace: starfleet
  labels:
    team: starfleet
spec:
  interceptors:
    - name: verify-github-push
      ref:
        name: github
      params:
        - name: secretRef
          value:
            secretName: github-webhook-secret
            secretKey: secretToken
        - name: eventTypes
          value: ["push"]
    - name: only-main
      ref:
        name: cel
      params:
        - name: filter
          value: "body.ref == 'refs/heads/main'"
        - name: overlays
          value:
            - key: branch_name
              expression: "body.ref.split('/')[2]"
  bindings:
    - ref: github-push
  template:
    ref: ci-build-run
