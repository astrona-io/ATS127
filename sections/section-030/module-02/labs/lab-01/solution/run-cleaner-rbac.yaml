apiVersion: v1
kind: ServiceAccount
metadata:
  name: run-cleaner
  namespace: starfleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: run-cleaner
  namespace: starfleet
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: run-cleaner
  namespace: starfleet
subjects:
  - kind: ServiceAccount
    name: run-cleaner
    namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: run-cleaner
