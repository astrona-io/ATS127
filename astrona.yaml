  - id: module-020
    title: "Verify And Filter Events With Interceptors"
    description: >
      How interceptors and ClusterInterceptors work and where a rejected event
      leaves its trace, verifying GitHub webhooks with an HMAC secret and
      eventTypes, the GitLab and Bitbucket interceptors, and filtering and
      enriching events with CEL filters and overlays.

    content:
