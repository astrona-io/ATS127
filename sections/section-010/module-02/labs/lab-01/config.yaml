# Scale And Place An EventListener
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-127-lab-010-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton"
      description: "Installs the tkn CLI 0.46.2, Tekton Pipelines v1.17.1 and Tekton Triggers v0.37.2 with the core interceptors, and starts the webhook client"
      type: "file"
      source: "bootstrap/01-install-tekton.sh"
    - name: "ats-127-lab-010-02-setup"
      description: "Applies the Pipeline, RBAC, binding, template and a plain EventListener starfleet-ci with one pod, a ClusterIP Service and no limits"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespace starfleet"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-tekton"
      description: "Waits until every Tekton Deployment and the webhook client are ready"
      type: "file"
      source: "testing/wait-for-tekton.sh"
    - name: "reference-solution"
      description: "The fix a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-eventlistener-spec"
      description: "Confirms the EventListener spec sets two replicas, the Service type NodePort, the pod label team=starfleet and the container limits"
      type: "file"
      source: "validation/validate-eventlistener-spec.sh"
    - name: "validate-pods"
      description: "Confirms two pods of the EventListener are Ready, labelled team=starfleet, and have the requested limits"
      type: "file"
      source: "validation/validate-pods.sh"
    - name: "validate-service-and-push"
      description: "Confirms the Service is a NodePort on port 8080 and an unsigned push creates a PipelineRun with the event's values"
      type: "file"
      source: "validation/validate-service-and-push.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
      - nicolaka/netshoot:v0.13
