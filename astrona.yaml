            url: https://tekton.dev/docs/triggers/eventlisteners/
          - name: "TriggerBindings"
            url: https://tekton.dev/docs/triggers/triggerbindings/
          - name: "TriggerTemplates"
            url: https://tekton.dev/docs/triggers/triggertemplates/
      - type: reading
        title: Summary
        path: sections/section-010/module-01/course-04-summary.md

      - type: reading
        title: Question
        path: sections/section-010/capstone/labs/lab-01/question.md
