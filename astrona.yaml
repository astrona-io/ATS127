      - type: reading
        title: Question
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: "Create An EventListener For Push Events Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: beginner
        estimated_duration: 25m
        topic: triggers-architecture
        task_kind: build
        tags: [eventlistener, eventlistener-rbac, serviceaccount, triggerbinding, triggertemplate, push-event]
        learning_goals:
          - Create an EventListener with a ServiceAccount bound to the two Triggers ClusterRoles
          - Map the fields of a push event to PipelineRun parameters with a TriggerBinding
