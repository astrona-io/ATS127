# Creates one PipelineRun of pr-check per accepted pull request event.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: pr-check-run
  namespace: starfleet
spec:
  params:
    - name: repo-url
      description: The clone URL of the repository
    - name: revision
      description: The head commit ID of the pull request
    - name: pr-number
      description: The number of the pull request
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: pr-check-run-
      spec:
        pipelineRef:
          name: pr-check
        params:
          - name: repo-url
            value: $(tt.params.repo-url)
          - name: revision
            value: $(tt.params.revision)
          - name: pr-number
            value: $(tt.params.pr-number)
