# The EventListener's ServiceAccount with the two bindings from the Triggers
# release: tekton-triggers-eventlistener-roles in starfleet (read Triggers
# objects, create PipelineRuns) and tekton-triggers-eventlistener-clusterroles
# (read ClusterTriggerBindings and ClusterInterceptors).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: starfleet-triggers
  namespace: starfleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: starfleet-triggers-eventlistener
  namespace: starfleet
subjects:
  - kind: ServiceAccount
    name: starfleet-triggers
    namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: starfleet-triggers-eventlistener
subjects:
  - kind: ServiceAccount
    name: starfleet-triggers
    namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
