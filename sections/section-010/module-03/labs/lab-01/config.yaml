# Repair A Multi-Resource Template
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-127-lab-010-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton"
      description: "Installs the tkn CLI 0.46.2, Tekton Pipelines v1.17.1 and Tekton Triggers v0.37.2 with the core interceptors, and starts the webhook client"
      type: "file"
      source: "bootstrap/01-install-tekton.sh"
    - name: "ats-127-lab-010-03-setup"
      description: "Applies the Pipeline, RBAC, a template that creates a PipelineRun and a ConfigMap, a binding with a wrong path, and the EventListener starfleet-ci"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespace starfleet"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-tekton"
      description: "Waits until every Tekton Deployment and the webhook client are ready"
      type: "file"
      source: "testing/wait-for-tekton.sh"
    - name: "reference-solution"
      description: "The fix a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-binding"
      description: "Confirms a push starts a PipelineRun with the commit ID, repository and branch of the event"
      type: "file"
      source: "validation/validate-binding.sh"
    - name: "validate-configmap"
      description: "Confirms the same push creates a ConfigMap with the revision, pusher and event"
      type: "file"
      source: "validation/validate-configmap.sh"
    - name: "validate-rbac-scope"
      description: "Confirms the ServiceAccount can create configmaps and has no broader rights"
      type: "file"
      source: "validation/validate-rbac-scope.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
      - nicolaka/netshoot:v0.13
