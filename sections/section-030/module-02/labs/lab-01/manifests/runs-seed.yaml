---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: release-1
  namespace: starfleet
  labels:
    purpose: release
spec:
  pipelineRef:
    name: ci-build
  params:
    - {name: repo-url, value: "https://git.starfleet.example/fleet/warp-core.git"}
