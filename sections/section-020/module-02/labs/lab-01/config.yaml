# Accept Signed GitLab Pushes
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-127-lab-020-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton"
      description: "Installs the tkn CLI 0.46.2, Tekton Pipelines v1.17.1 and Tekton Triggers v0.37.2 with the core interceptors, and starts the webhook client"
      type: "file"
      source: "bootstrap/01-install-tekton.sh"
    - name: "ats-127-lab-020-02-setup"
      description: "Applies the Pipeline, RBAC, the GitLab token Secret, the template, the binding and an EventListener starfleet-ci without interceptors"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespace starfleet"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-tekton"
      description: "Waits until every Tekton Deployment and the webhook client are ready"
      type: "file"
      source: "testing/wait-for-tekton.sh"
    - name: "reference-solution"
      description: "The fix a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-token"
      description: "Confirms a push with the right token starts a run with the short branch name, and a wrong or missing token starts nothing"
      type: "file"
      source: "validation/validate-token.sh"
    - name: "validate-event-type"
      description: "Confirms an event of another type with the right token starts nothing"
      type: "file"
      source: "validation/validate-event-type.sh"
    - name: "validate-branch-filter"
      description: "Confirms a push to another branch starts nothing and the gitlab interceptor is in place"
      type: "file"
      source: "validation/validate-branch-filter.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
      - nicolaka/netshoot:v0.13
