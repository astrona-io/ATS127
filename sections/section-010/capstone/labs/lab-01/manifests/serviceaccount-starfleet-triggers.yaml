# The EventListener's ServiceAccount, as the capstone starts. It has a fault:
# only the ClusterRoleBinding to tekton-triggers-eventlistener-clusterroles
# exists. The RoleBinding to tekton-triggers-eventlistener-roles is missing,
# so the EventListener pod cannot read the Triggers objects in starfleet.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: starfleet-triggers
  namespace: starfleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: starfleet-triggers-eventlistener
subjects:
  - kind: ServiceAccount
    name: starfleet-triggers
    namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
