        path: sections/section-010/module-01/course-01-install-triggers-and-its-resources.md
      - type: reading
        title: "The EventListener, Its ServiceAccount And RBAC"
        path: sections/section-010/module-01/course-02-eventlistener-serviceaccount-and-rbac.md
      - type: reading
        title: "TriggerBindings, TriggerTemplates And tt.params"
