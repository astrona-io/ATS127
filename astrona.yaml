# Course manifest for ATS127 - Triggers, Interceptors & Event-Driven CI (Tekton).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's summary page
# comes last. The section capstone closes the section. Playgrounds are not
# listed: the landing page's playground marker shows them. solution.md is
# never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS127
  title: "Tekton: Triggers, Interceptors & Event-Driven CI"
  maturity: draft
  description: >
    Training material covering the Triggers, Interceptors & Event-Driven CI
    domain of the Tekton training path: installing Tekton Triggers on top of
    Tekton Pipelines, the EventListener with its Deployment, Service,
    ServiceAccount and RBAC, Triggers, TriggerBindings, ClusterTriggerBindings
    and TriggerTemplates with tt.params, interceptors and ClusterInterceptors,
    verifying GitHub webhooks with an HMAC secret, filtering and enriching
    events with CEL, and running push and pull request CI through standalone
    Triggers, with event tracing and cleanup. Webhooks are signed and sent from
    a client pod inside the cluster, so no Git hosting account is needed. Each
    module pairs a layered reader with an ungraded hands-on playground and a
    graded practice lab. Each section closes with an integration capstone.
    Written for Tekton Triggers v0.37.2, Tekton Pipelines v1.17.1 and tkn
    v0.46.2.

  certification:
    name: Tekton
    code: TEKTON
    provider: Astrona
    domain: "Triggers, Interceptors & Event-Driven CI"
    weight: 15

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

  - id: module-010
    title: "Tekton Triggers Architecture And RBAC"
    description: >
      Installing Tekton Triggers and its core interceptors, the Triggers
      resources, the EventListener with its Deployment, Service and pod, the
      ServiceAccount and the RBAC from the Triggers release, and mapping event
      fields to PipelineRun parameters with TriggerBindings,
      ClusterTriggerBindings and TriggerTemplates.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-010/README.md

      - type: reading
        title: "Turn A Webhook Into A PipelineRun"
